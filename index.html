<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
    overflow-x:hidden;
}

/* Arka plan */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    max-width:900px;
    height:90vw;
    max-height:900px;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.12;
    z-index:-1;
}

h1{
    font-size:2.2em;
}

.quote{
    font-style:italic;
    margin-bottom:30px;
    padding:0 10px;
}

/* KART */
.poem-card{
    background:#fff8f0;
    width:90%;
    max-width:600px;
    margin:15px auto;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.poem-card:hover{
    transform:scale(1.02);
}

.poem-title{
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:1.2em;
}

.arrow{
    transition:0.3s;
}

.poem-text{
    display:none;
    margin-top:15px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
    font-size:0.95em;
    line-height:1.6;
}

.poem-text.active{
    display:block;
}

audio{
    width:100%;
    margin-top:10px;
}

footer{
    margin-top:50px;
    font-size:14px;
}

/* MOBİL İYİLEŞTİRME */
@media(max-width:480px){
    h1{font-size:1.8em;}
    .poem-title{font-size:1.05em;}
    .poem-text{font-size:0.9em;}
}
</style>

</head>

<body>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<!-- ŞİİR KARTLARI -->

<script>
function kart(no, baslik){
    document.write(`
    <div class="poem-card">
        <h2 class="poem-title" onclick="siirGoster(${no})">
        ${baslik} <span id="ok${no}" class="arrow">▼</span>
        </h2>
        <div id="siir${no}" class="poem-text">
            <audio controls>
            <source src="siir${no}.mp3" type="audio/mpeg">
            </audio>

            Şiir metni buraya gelecek...
        </div>
    </div>
    `);
}
</script>

<script>
kart(1,"İstiklal Marşı");
kart(2,"Şiir 2");
kart(3,"Şiir 3");
kart(4,"Şiir 4");
kart(5,"Şiir 5");
kart(6,"Şiir 6");
kart(7,"Şiir 7");
kart(8,"Şiir 8");
kart(9,"Şiir 9");
kart(10,"Şiir 10");
</script>

<footer>© 2026 Şiir Sesleri</footer>

<script>
// SADECE BİRİ AÇIK KALSIN
function siirGoster(no){

    for(let i=1;i<=10;i++){
        let siir = document.getElementById("siir"+i);
        let ok = document.getElementById("ok"+i);
        let audio = siir.querySelector("audio");

        if(i === no){
            let aktif = siir.classList.contains("active");

            // önce hepsini kapat
            document.querySelectorAll(".poem-text").forEach(el=>{
                el.classList.remove("active");

                // SESLERİ DURDUR
                let a = el.querySelector("audio");
                if(a){
                    a.pause();
                    a.currentTime = 0;
                }
            });

            document.querySelectorAll(".arrow").forEach(el=>{
                el.style.transform="rotate(0deg)";
            });

            // eğer kapalıysa aç
            if(!aktif){
                siir.classList.add("active");
                ok.style.transform="rotate(180deg)";
            }

        }
    }
}
    
</script>

</body>
</html>
