<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
}

/* Arka plan */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    max-width:900px;
    height:90vw;
    max-height:900px;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.12;
    z-index:-1;
}

h1{font-size:2.2em;}

.quote{
    font-style:italic;
    margin-bottom:15px;
}

/* SEARCH */
.search-box{
    width:90%;
    max-width:400px;
    padding:12px;
    margin-bottom:25px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
    transition:0.3s;
}

/* BLUR EFFECT WHEN MODAL OPEN, EXCEPT ACTIVE CARD */
.poem-container.modal-open .poem-card:not(.active-focus){
    filter: blur(3px);
    opacity:0.4;
}

/* CARD */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}

.poem-card:hover{
    transform:translateY(-5px) scale(1.02);
}

.poem-title{
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.arrow{transition:0.3s;}

.poem-text{
    display:none;
    margin-top:15px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
}

.poem-text.active{
    display:block;
}

/* MODAL EFFECT */
.poem-card.active-focus{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(1.1);
    z-index:1000;
    width:90%;
    max-width:700px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    background:#fff8f0;
}

/* AUDIO */
audio{
    width:100%;
    margin-top:10px;
}

/* SIGNATURE */
.signature{
    position:fixed;
    bottom:15px;
    right:15px;
    font-weight:bold;
    font-style:italic;
    color:#3b2f2f;
    opacity:0.7;
    z-index:999;
}

/* MOBILE */
@media(max-width:600px){
    .poem-container{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<!-- SEARCH -->
<input class="search-box" id="search" onkeyup="filterPoems()" placeholder="Şiir ara...">

<div class="poem-container">
<script>
function kart(no, baslik){
    document.write(`
    <div class="poem-card" data-title="${baslik}">
        <h2 class="poem-title" onclick="siirGoster(event, ${no})">
        ${baslik} <span id="ok${no}" class="arrow">▼</span>
        </h2>
        <div id="siir${no}" class="poem-text">
            <audio controls>
            <source src="siir${no}.mp3" type="audio/mpeg">
            </audio>

            Şiir metni buraya gelecek...
        </div>
    </div>
    `);
}

for(let i=1;i<=10;i++){
    kart(i,"Şiir "+i);
}
</script>
</div>

<footer>© 2026 Şiir Sesleri</footer>

<!-- SIGNATURE -->
<div class="signature">ahmaddarrak7765</div>

<script>
// 📌 SINGLE OPEN + MODAL + BLUR + AUDIO STOP
function siirGoster(event, no){
    event.stopPropagation(); // Tıklama olayını yukarı göndermeyi durdur
    let container = document.querySelector(".poem-container");

    for(let i=1;i<=10;i++){
        let siir = document.getElementById("siir"+i);
        let ok = document.getElementById("ok"+i);
        let card = siir.parentElement;

        if(i === no){
            let aktif = siir.classList.contains("active");

            // Tüm kartları kapat
            document.querySelectorAll(".poem-text").forEach(el=>{
                el.classList.remove("active");
                let a = el.querySelector("audio");
                if(a){ a.pause(); a.currentTime = 0; }
            });

            document.querySelectorAll(".arrow").forEach(el=>{
                el.style.transform="rotate(0deg)";
            });

            document.querySelectorAll(".poem-card").forEach(c=>{
                c.classList.remove("active-focus");
            });

            if(!aktif){
                // Aktif kart aç
                siir.classList.add("active");
                ok.style.transform="rotate(180deg)";
                container.classList.add("modal-open");
                card.classList.add("active-focus");
            } else {
                // Kart kapat
                container.classList.remove("modal-open");
            }
        }
    }
}

// 🔍 FILTER (TR SAFE)
function normalizeText(text){
    return text.toLowerCase()
        .replace(/ı/g,"i")
        .replace(/i̇/g,"i")
        .replace(/ç/g,"c")
        .replace(/ğ/g,"g")
        .replace(/ş/g,"s")
        .replace(/ö/g,"o")
        .replace(/ü/g,"u");
}

function filterPoems(){
    let input = normalizeText(document.getElementById("search").value);
    document.querySelectorAll(".poem-card").forEach(card=>{
        let title = normalizeText(card.getAttribute("data-title"));
        card.style.display = title.includes(input) ? "block" : "none";
    });
}

// ESC veya ekrana tıklayınca kapatma
document.addEventListener("click", function(e){
    let container = document.querySelector(".poem-container");
    if(container.classList.contains("modal-open")){
        // Tüm kartları kapat
        document.querySelectorAll(".poem-text").forEach(el=>{
            el.classList.remove("active");
            let a = el.querySelector("audio");
            if(a){ a.pause(); a.currentTime = 0; }
        });
        document.querySelectorAll(".arrow").forEach(el=>{
            el.style.transform="rotate(0deg)";
        });
        document.querySelectorAll(".poem-card").forEach(c=>{
            c.classList.remove("active-focus");
        });
        container.classList.remove("modal-open");
    }
});

// ESC ile kapatma
document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        document.querySelectorAll(".poem-text").forEach(el=>{
            el.classList.remove("active");
            let a = el.querySelector("audio");
            if(a){ a.pause(); a.currentTime = 0; }
        });
        document.querySelectorAll(".arrow").forEach(el=>{
            el.style.transform="rotate(0deg)";
        });
        document.querySelectorAll(".poem-card").forEach(c=>{
            c.classList.remove("active-focus");
        });
        document.querySelector(".poem-container").classList.remove("modal-open");
    }
});
</script>

</body>
</html>
