<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>

body{
    margin:0;
    padding:60px 20px;
    background:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
}

h1{
    font-size:3em;
    margin-bottom:10px;
}

.quote{
    font-style:italic;
    margin-bottom:40px;
}

.poem-card{
    background:#fff8f0;
    width:360px;
    margin:auto;
    padding:30px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.poem-title{
    cursor:pointer;
    color:#6b4c3b;
}

/* ŞİİR BAŞTA GİZLİ */

.poem-text{
    display:none;
    margin-top:20px;
    white-space:pre-line;
}

</style>

<script>

function siirGoster(){
    let siir = document.getElementById("siir");

    if(siir.style.display=="none"){
        siir.style.display="block";
    }else{
        siir.style.display="none";
    }
}

</script>

</head>

<body>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<div class="poem-card">

<h2 class="poem-title" onclick="siirGoster()">
İstiklal Marşı
</h2>

<div id="siir" class="poem-text">

Korkma, sönmez bu şafaklarda yüzen al sancak;  
Sönmeden yurdumun üstünde tüten en son ocak.  
O benim milletimin yıldızıdır, parlayacak;  
O benimdir, o benim milletimindir ancak.

</div>

</div>

</body>
</html>
