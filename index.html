/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:500;
}

.overlay.active{
    opacity:1;
    pointer-events:auto;
}

/* CARD */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}

.poem-card:hover{
    transform:translateY(-5px) scale(1.02);
    background-color:#fff1e0;
}

.poem-title{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.arrow{transition:0.3s;}

.poem-text{
    display:none;
    margin-top:15px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
    transform:scale(1.03);
}

/* MODAL */
.poem-card.active-focus{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(1);
    z-index:1000;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:700px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    z-index:1000;
    background:#fff8f0;
    animation:fadeInScale 0.3s forwards;
}

@keyframes fadeInScale{
    from { opacity:0; transform:translate(-50%,-50%) scale(0.9);}
    to { opacity:1; transform:translate(-50%,-50%) scale(1);}
.poem-text{
    display:none;
    margin-top:10px;
}

.poem-text.active{
    display:block;
}

/* AUDIO */
audio{
    width:100%;
    margin-top:10px;
}
audio{width:100%;}

.overlay{

function fadeAudio(audio, type){
    let step=50;
    if(type==='in'){
        audio.volume=0;

            if(audio.volume<=0){

                audio.currentTime=0;
                clearInterval(fade);
            }

    }
}

function normalizeText(text){
    return text.toLowerCase()
        .replace(/ı/g,"i").replace(/i̇/g,"i")
        .replace(/ç/g,"c").replace(/ğ/g,"g")
        .replace(/ş/g,"s")
        .replace(/ö/g,"o").replace(/ü/g,"u");

function filterPoems(){

    document.querySelectorAll(".poem-card").forEach(card=>{
