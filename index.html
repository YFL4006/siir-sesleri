<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şiir Sesleri</title>
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #333;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Sol dekoratif bitki */
    .left-decor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100px;
      height: 100%;
      opacity: 0.15;
      z-index: 0;
    }

    /* Sağ dekoratif ağaç */
    .right-decor {
      position: fixed;
      top: 0;
      right: 0;
      width: 100px;
      height: 100%;
      opacity: 0.15;
      z-index: 0;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 30px;
      font-style: italic;
      color: #5a3e36;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }

    .poem-card {
      background-color: #fff8f0;
      border: 1px solid #e2d8c3;
      border-radius: 12px;
      width: 320px;
      margin: 0 auto;
      padding: 25px;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
      z-index: 1;
    }
    .poem-card:hover {
      transform: scale(1.03);
      box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
    }

    h2 {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #6b4c3b;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #888;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Sol dekor SVG -->
  <div class="left-decor">
    <svg viewBox="0 0 64 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <path d="M32 0 L36 64 L28 128 L32 192 L26 256" stroke="green" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <!-- Sağ dekor SVG -->
  <div class="right-decor">
    <svg viewBox="0 0 64 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <path d="M32 0 L28 64 L36 128 L32 192 L38 256" stroke="green" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <h1>Şiir Sesleri</h1>

  <div class="poem-card">
    <h2>İstiklal Marşı</h2>
    <audio controls>
      <source src="istiklalmarsi.mp3" type="audio/mpeg">
    </audio>
  </div>

  <footer>Yunus Emre ruhunu anan şiir sesleri</footer>
</body>
</html>
