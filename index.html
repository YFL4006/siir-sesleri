<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
}

/* Arka plan */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    max-width:900px;
    height:90vw;
    max-height:900px;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.12;
    z-index:-1;
}

h1{font-size:2.2em;}

.quote{
    font-style:italic;
    margin-bottom:15px;
}

/* SEARCH */
.search-box{
    width:90%;
    max-width:400px;
    padding:12px;
    margin-bottom:25px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
    transition:0.3s;
}

/* DARK OVERLAY WHEN MODAL OPEN */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:500;
}

.overlay.active{
    opacity:1;
    pointer-events:auto;
}

/* CARD */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition:0.3s, background-color 0.3s;
    cursor:pointer;
}

/* HOVER COLOR CHANGE */
.poem-card:hover{
    transform:translateY(-5px) scale(1.02);
    background-color:#fff1e0;
}

.poem-title{
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.arrow{transition:0.3s;}

.poem-text{
    display:none;
    margin-top:15px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
}

/* FADE IN / OUT EFFECT FOR CARD */
.poem-card.active-focus{
    display:block;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.9);
    z-index:1000;
    width:90%;
    max-width:700px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
    background:#fff8f0;
    opacity:0;
    animation:fadeInScale 0.35s forwards;
}

/* ANIMATION */
@keyframes fadeInScale{
    0% { opacity:0; transform:translate(-50%, -50%) scale(0.9);}
    100% { opacity:1; transform:translate(-50%, -50%) scale(1.05);}
}

.poem-text.active{
    display:block;
}

/* AUDIO */
audio{
    width:100%;
    margin-top:10px;
}

/* SIGNATURE */
.signature{
    position:fixed;
    bottom:15px;
    right:15px;
    font-weight:bold;
    font-style:italic;
    color:#3b2f2f;
    opacity:0.7;
    z-index:999;
}

/* MOBILE */
@media(max-width:600px){
    .poem-container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<!-- SEARCH -->
<input class="search-box" id="search" onkeyup="filterPoems()" placeholder="Şiir ara...">

<div class="poem-container"></div>

<!-- DARK OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- SIGNATURE -->
<div class="signature">ahmaddarrak7765</div>

<script>
// SOUNDS
let openSound = new Audio('bloop.mp3');      // kart açılınca
let closeSound = new Audio('pageflip.mp3');  // kart kapanınca

// CREATE CARDS
function kart(no, baslik){
    document.querySelector('.poem-container').innerHTML += `
    <div class="poem-card" data-title="${baslik}">
        <h2 class="poem-title" onclick="siirGoster(event, ${no})">
        ${baslik} <span id="ok${no}" class="arrow">▼</span>
        </h2>
        <div id="siir${no}" class="poem-text">
            <audio id="audio${no}" controls>
            <source src="siir${no}.mp3" type="audio/mpeg">
            </audio>
            Şiir metni buraya gelecek...
        </div>
    </div>`;
}

for(let i=1;i<=10;i++){ kart(i,"Şiir "+i); }

// AUDIO FADE IN / OUT
function fadeAudio(audio, type, duration=500){
    let step=50;
    if(type==='in'){
        audio.volume=0;
        audio.play();
        let vol=0;
        let fadeIn = setInterval(()=>{
            vol+=0.05;
            if(vol>=0.2){ audio.volume=0.2; clearInterval(fadeIn);}
            else audio.volume=vol;
        }, step);
    } else {
        let fadeOut = setInterval(()=>{
            audio.volume-=0.05;
            if(audio.volume<=0){ audio.pause(); audio.currentTime=0; clearInterval(fadeOut);}
        }, step);
    }
}

// OPEN/CLOSE CARD
function siirGoster(event,no){
    event.stopPropagation();
    let container = document.querySelector(".poem-container");
    let overlay = document.getElementById("overlay");

    for(let i=1;i<=10;i++){
        let siir = document.getElementById("siir"+i);
        let ok = document.getElementById("ok"+i);
        let card = siir.parentElement;
        let audio = document.getElementById("audio"+i);

        if(i===no){
            let aktif = siir.classList.contains("active");

            // CLOSE ALL
            document.querySelectorAll(".poem-text").forEach(el=>{
                el.classList.remove("active");
                let a = el.querySelector("audio");
                if(a) fadeAudio(a,'out');
            });
            document.querySelectorAll(".arrow").forEach(el=>{ el.style.transform="rotate(0deg)"; });
            document.querySelectorAll(".poem-card").forEach(c=>{ c.classList.remove("active-focus"); });

            if(!aktif){
                siir.classList.add("active");
                ok.style.transform="rotate(180deg)";
                card.classList.add("active-focus");
                overlay.classList.add("active");
                openSound.currentTime=0; openSound.play();
                fadeAudio(audio,'in');
            } else {
                overlay.classList.remove("active");
                closeSound.currentTime=0; closeSound.play();
            }
        }
    }
}

// CLOSE MODAL ON CLICK OUTSIDE OR ESC
document.getElementById("overlay").addEventListener("click", closeAll);
document.addEventListener("keydown", function(e){
    if(e.key==="Escape") closeAll();
});

function closeAll(){
    document.querySelectorAll(".poem-text").forEach(el=>{
        el.classList.remove("active");
        let a = el.querySelector("audio");
        if(a) fadeAudio(a,'out');
    });
    document.querySelectorAll(".arrow").forEach(el=>{ el.style.transform="rotate(0deg)"; });
    document.querySelectorAll(".poem-card").forEach(c=>{ c.classList.remove("active-focus"); });
    document.getElementById("overlay").classList.remove("active");
    closeSound.currentTime=0; closeSound.play();
}

// SEARCH FILTER
function normalizeText(text){
    return text.toLowerCase()
        .replace(/ı/g,"i").replace(/i̇/g,"i")
        .replace(/ç/g,"c").replace(/ğ/g,"g")
        .replace(/ş/g,"s")
        .replace(/ö/g,"o").replace(/ü/g,"u");
}
function filterPoems(){
    let input = normalizeText(document.getElementById("search").value);
    document.querySelectorAll(".poem-card").forEach(card=>{
        let title = normalizeText(card.getAttribute("data-title"));
        card.style.display = title.includes(input) ? "block" : "none";
    });
}
</script>

</body>
</html>
