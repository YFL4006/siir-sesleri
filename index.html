<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
}

/* Arka plan */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    max-width:900px;
    height:90vw;
    max-height:900px;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.12;
    z-index:-1;
}

h1{font-size:2.2em;}

.quote{
    font-style:italic;
    margin-bottom:15px;
}

/* SEARCH */
.search-box{
    width:90%;
    max-width:400px;
    padding:12px;
    margin-bottom:25px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
}

/* CARD */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.35s ease;
}

/* AKTİF KART (SADECE ZOOM) */
.poem-card.active-focus{
    transform: scale(1.12);
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    z-index:5;
}

/* hover */
.poem-card:hover{
    transform:translateY(-5px) scale(1.02);
}

.poem-title{
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.arrow{transition:0.3s;}

.poem-text{
    display:none;
    margin-top:15px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
}

.poem-text.active{
    display:block;
}

audio{
    width:100%;
    margin-top:10px;
}

/* MOBILE */
@media(max-width:600px){
    .poem-container{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<input class="search-box" id="search" onkeyup="filterPoems()" placeholder="Şiir ara...">

<div class="poem-container">

<script>
function kart(no, baslik){
    document.write(`
    <div class="poem-card" data-title="${baslik}">
        <h2 class="poem-title" onclick="siirGoster(${no})">
        ${baslik} <span id="ok${no}" class="arrow">▼</span>
        </h2>
        <div id="siir${no}" class="poem-text">
            <audio controls>
            <source src="siir${no}.mp3" type="audio/mpeg">
            </audio>

            Şiir metni buraya gelecek...
        </div>
    </div>
    `);
}

for(let i=1;i<=10;i++){
    kart(i,"Şiir "+i);
}
</script>

</div>

<footer>© 2026 Şiir Sesleri</footer>

<script>

function siirGoster(no){

    for(let i=1;i<=10;i++){
        let siir = document.getElementById("siir"+i);
        let ok = document.getElementById("ok"+i);
        let card = siir.parentElement;

        if(i === no){
            let aktif = siir.classList.contains("active");

            document.querySelectorAll(".poem-text").forEach(el=>{
                el.classList.remove("active");

                let a = el.querySelector("audio");
                if(a){
                    a.pause();
                    a.currentTime = 0;
                }
            });

            document.querySelectorAll(".arrow").forEach(el=>{
                el.style.transform="rotate(0deg)";
            });

            document.querySelectorAll(".poem-card").forEach(c=>{
                c.classList.remove("active-focus");
            });

            if(!aktif){
                siir.classList.add("active");
                ok.style.transform="rotate(180deg)");
                card.classList.add("active-focus");
            }
        }
    }
}

// FILTER
function normalizeText(text){
    return text.toLowerCase()
        .replace(/ı/g,"i")
        .replace(/i̇/g,"i")
        .replace(/ç/g,"c")
        .replace(/ğ/g,"g")
        .replace(/ş/g,"s")
        .replace(/ö/g,"o")
        .replace(/ü/g,"u");
}

function filterPoems(){
    let input = normalizeText(document.getElementById("search").value);

    document.querySelectorAll(".poem-card").forEach(card=>{
        let title = normalizeText(card.getAttribute("data-title"));

        if(title.includes(input)){
            card.style.display="block";
        }else{
            card.style.display="none";
        }
    });
}

</script>

</body>
</html>
