<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
}

body.dark{
    --bg1:#121212;
    --bg2:#1f1f1f;
    --text:#f5f5f5;
    --card:#2a2a2a;
}

body{
    font-family:Georgia, serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:35px 15px;
    text-align:center;
    overflow-x:hidden;
    transition:background .5s, color .4s;
}

*{margin:0;padding:0;box-sizing:border-box;}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(7px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:500;
}

body.modal-open .overlay{
    opacity:1;
    pointer-events:auto;
}

#particles{
    position:fixed;
    inset:0;
    z-index:-1;
}

h1{font-size:2.3em;margin-bottom:10px;}

.quote{
    font-style:italic;
    margin-bottom:22px;
    opacity:.85;
    font-size:18px;
}

.controls{
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,input{
    padding:10px 14px;
    border:none;
    border-radius:12px;
    font-size:15px;
}

button{
    cursor:pointer;
    background:var(--card);
    color:var(--text);
    transition:.25s;
}

button:hover{transform:translateY(-3px);}
button:active{transform:scale(0.9);}

button.random-animate{animation:shake .4s;}

@keyframes shake{
    0%{transform:rotate(0)}
    25%{transform:rotate(-6deg)}
    50%{transform:rotate(6deg)}
    75%{transform:rotate(-4deg)}
    100%{transform:rotate(0)}
}

input{width:230px;}

.poem-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    max-width:950px;
    margin:auto;
}

.poem-card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
}

.poem-card.highlight{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(255,140,0,.5);
}

.poem-header{cursor:pointer;}

.poem-name{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.poem-text{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:.4s;
    white-space:pre-line;
}

.poem-card.open .poem-text{
    max-height:500px;
    opacity:1;
    padding-top:10px;
}

/* modal */
.poem-card.active{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(92%,520px);
    z-index:999;
    animation:popup .3s ease;
}

@keyframes popup{
    from{transform:translate(-50%,-50%) scale(.8);}
    to{transform:translate(-50%,-50%) scale(1);}
}

</style>
</head>

<body>

<div class="overlay" onclick="closeCard()"></div>
<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>
<div class="quote">Değerle düşün, Bilimle üret, Doğayla yaşa!</div>

<div class="controls">
    <button id="randomBtn" onclick="randomSiir()">🎲 Rastgele</button>
    <input id="search" placeholder="Şiir ara..." onkeyup="filterPoems()">
    <button id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>

<div class="poem-container" id="list"></div>

<script>
const siirler=[
{baslik:"Şiir 1",metin:`Kalbimde sessiz bir rüzgar,\nGeceye düşer hatıralar.`},
{baslik:"Şiir 2",metin:`Yollar uzun, gözler yorgun,\nAşk yine bana vurgun.`},
{baslik:"Şiir 3",metin:`Deniz kadar derin sustum,\nAdını içimde duydum.`},
{baslik:"Şiir 4",metin:`Bir yıldız kaydı geceden,\nBen geçemedim senden.`},
{baslik:"Şiir 5",metin:`Zaman geçer iz bırakır,\nGiden kalpte sızı yakar.`}
];

const list=document.getElementById("list");
const themeBtn=document.getElementById("themeBtn");

/* render */
function render(){
    list.innerHTML="";
    siirler.forEach((s,i)=>{
        list.innerHTML+=`
        <div class="poem-card" id="card-${i}">
            <div class="poem-header" onclick="toggleCard(${i})">
                <div class="poem-name">${s.baslik}</div>
            </div>
            <div class="poem-text">${s.metin}</div>
        </div>`;
    });
}

/* card */
function toggleCard(i){
    let card=document.getElementById("card-"+i);
    closeCard();
    card.classList.add("open","active");
    document.body.classList.add("modal-open");
}

function closeCard(){
    document.querySelectorAll(".poem-card").forEach(c=>{
        c.classList.remove("open","active","highlight");
    });
    document.body.classList.remove("modal-open");
}

/* 🎰 ROULETTE EFFECT */
function randomSiir(){
    let btn=document.getElementById("randomBtn");
    btn.classList.add("random-animate");

    let cards=document.querySelectorAll(".poem-card");

    let index=0;
    let rounds=0;
    let max=18;

    let interval=setInterval(()=>{
        cards.forEach(c=>c.classList.remove("highlight"));
        cards[index].classList.add("highlight");

        index=(index+1)%cards.length;
        rounds++;

        if(rounds>max){
            clearInterval(interval);

            let finalIndex=Math.floor(Math.random()*cards.length);

            setTimeout(()=>{
                toggleCard(finalIndex);
            },250);
        }
    },90);

    setTimeout(()=>btn.classList.remove("random-animate"),500);
}

/* search */
function filterPoems(){
    let val=document.getElementById("search").value.toLowerCase();
    document.querySelectorAll(".poem-card").forEach(card=>{
        let t=card.querySelector(".poem-name").innerText.toLowerCase();
        card.style.display=t.includes(val)?"block":"none";
    });
}

/* 🌙 THEME */
function toggleTheme(){
    document.body.classList.toggle("dark");
    localStorage.setItem("theme",
        document.body.classList.contains("dark")?"dark":"light"
    );
    updateTheme();
}

function updateTheme(){
    themeBtn.innerText=document.body.classList.contains("dark")?"☀️":"🌙";
}

(function(){
    if(localStorage.getItem("theme")==="dark"){
        document.body.classList.add("dark");
    }
    updateTheme();
})();

render();

/* particles */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let w,h,p=[];

function resize(){
    w=canvas.width=innerWidth;
    h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

for(let i=0;i<60;i++){
    p.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*2,
        dx:(Math.random()-.5)*0.5,
        dy:(Math.random()-.5)*0.5
    });
}

function animate(){
    ctx.clearRect(0,0,w,h);
    for(let i of p){
        i.x+=i.dx;i.y+=i.dy;
        if(i.x<0||i.x>w)i.dx*=-1;
        if(i.y<0||i.y>h)i.dy*=-1;

        ctx.beginPath();
        ctx.arc(i.x,i.y,i.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.8)";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
