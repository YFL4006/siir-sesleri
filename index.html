<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
}

/* arka plan */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    max-width:900px;
    height:90vw;
    max-height:900px;
    background:url("yunusemre.png") no-repeat center/contain;
    opacity:0.12;
    z-index:-1;
}

/* blur */
.poem-container.blurred .poem-card{
    filter: blur(3px);
    opacity:0.3;
    transition:0.3s;
}

.poem-container.blurred .active-focus{
    filter: blur(0);
    opacity:1;
}

/* kart */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.4s ease;
}

/* ORTALAMA + BÜYÜTME */
.poem-card.active-focus{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%) scale(1.25);
    width:90%;
    max-width:600px;
    z-index:100;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

/* hover */
.poem-card:hover{
    transform:translateY(-5px) scale(1.02);
}

.poem-title{
    cursor:pointer;
}

.poem-text{
    display:none;
    margin-top:15px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
}

.poem-text.active{
    display:block;
}

.search-box{
    padding:10px;
    margin-bottom:20px;
}

/* mobile */
@media(max-width:600px){
    .poem-container{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<h1>Şiir Sesleri</h1>

<input class="search-box" id="search" onkeyup="filterPoems()" placeholder="Şiir ara...">

<div class="poem-container">

<script>
function kart(no, baslik){
    document.write(`
    <div class="poem-card" data-title="${baslik}">
        <h2 onclick="siirGoster(${no})">${baslik}</h2>
        <div id="siir${no}" class="poem-text">
            <audio controls>
                <source src="siir${no}.mp3">
            </audio>
            Şiir metni...
        </div>
    </div>
    `);
}

for(let i=1;i<=10;i++){
    kart(i,"Şiir "+i);
}
</script>

</div>

<script>

function siirGoster(no){

    let container = document.querySelector(".poem-container");

    for(let i=1;i<=10;i++){
        let siir = document.getElementById("siir"+i);
        let card = siir.parentElement;

        if(i === no){
            let aktif = siir.classList.contains("active");

            document.querySelectorAll(".poem-text").forEach(el=>{
                el.classList.remove("active");
            });

            document.querySelectorAll(".poem-card").forEach(c=>{
                c.classList.remove("active-focus");
            });

            if(!aktif){
                siir.classList.add("active");
                card.classList.add("active-focus");
                container.classList.add("blurred");

                // 💥 ORTAYA SCROLL (yeni sayfa hissini azaltır)
                card.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            }else{
                container.classList.remove("blurred");
            }
        }
    }
}

// filter
function filterPoems(){
    let input = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".poem-card").forEach(card=>{
        let title = card.getAttribute("data-title").toLowerCase();

        card.style.display = title.includes(input) ? "block" : "none";
    });
}

</script>

</body>
</html>
