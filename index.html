<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
}

body.dark{
    --bg1:#121212;
    --bg2:#1f1f1f;
    --text:#f5f5f5;
    --card:#2a2a2a;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Georgia, serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:35px 15px;
    text-align:center;
    transition:.4s;
}

/* particles */
#particles{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* controls */
.controls{
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,input{
    padding:10px 14px;
    border:none;
    border-radius:12px;
    font-size:15px;
}

button{
    cursor:pointer;
    background:var(--card);
    transition:.2s;
}

button:hover{transform:translateY(-3px);}
button:active{transform:scale(0.92);}

input{width:230px;}

/* grid */
.poem-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    max-width:950px;
    margin:auto;
}

/* card */
.poem-card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    cursor:pointer;
    transition:.25s;
}

.poem-card:hover{
    transform:translateY(-5px);
}

.poem-name{
    font-size:22px;
    font-weight:bold;
}

/* 🔥 GERÇEK SMOOTH FADE FIX */
.poem-text{
    margin-top:10px;
    opacity:0;
    transform:translateY(-12px) scale(.96);
    filter:blur(6px);

    transition:
        opacity .35s ease,
        transform .45s cubic-bezier(.2,1.2,.2,1),
        filter .45s ease;

    pointer-events:none;
}

/* OPEN */
.poem-card.open .poem-text{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
    pointer-events:auto;
}

/* active modal */
.poem-card.active{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(92%,520px);
    z-index:999;
    animation:pop .4s cubic-bezier(.2,1.3,.2,1);
}

@keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.85);opacity:0}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* RANDOM anim */
button.random-animate{
    animation:shake .4s;
}

@keyframes shake{
    0%{transform:rotate(0)}
    25%{transform:rotate(-6deg)}
    50%{transform:rotate(6deg)}
    75%{transform:rotate(-4deg)}
    100%{transform:rotate(0)}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="controls">
    <button id="randomBtn" onclick="randomSiir()">🎲 Rastgele</button>
    <input id="search" placeholder="Şiir ara..." onkeyup="filterPoems()">
    <button onclick="toggleTheme()">🌙</button>
</div>

<div class="poem-container" id="list"></div>

<script>
const siirler=[
{baslik:"Şiir 1",metin:"Kalbimde sessiz bir rüzgar"},
{baslik:"Şiir 2",metin:"Yollar uzun, gözler yorgun"},
{baslik:"Şiir 3",metin:"Deniz kadar derin sustum"},
{baslik:"Şiir 4",metin:"Bir yıldız kaydı geceden"},
{baslik:"Şiir 5",metin:"Zaman geçer iz bırakır"}
];

const list=document.getElementById("list");

function render(){
    list.innerHTML="";
    siirler.forEach((s,i)=>{
        list.innerHTML+=`
        <div class="poem-card" id="card-${i}" onclick="toggleCard(${i})">
            <div class="poem-name">${s.baslik}</div>
            <div class="poem-text">${s.metin}</div>
        </div>`;
    });
}

function closeAll(){
    document.querySelectorAll(".poem-card")
    .forEach(c=>c.classList.remove("open","active"));
}

function toggleCard(i){
    let card=document.getElementById("card-"+i);
    let open=card.classList.contains("active");

    closeAll();

    if(!open){
        card.classList.add("open","active");
    }
}

/* random */
function randomSiir(){
    let btn=document.getElementById("randomBtn");
    btn.classList.add("random-animate");
    setTimeout(()=>btn.classList.remove("random-animate"),400);

    let i=Math.floor(Math.random()*siirler.length);
    toggleCard(i);
}

/* search */
function filterPoems(){
    let val=document.getElementById("search").value.toLowerCase();
    document.querySelectorAll(".poem-card").forEach(c=>{
        let t=c.querySelector(".poem-name").innerText.toLowerCase();
        c.style.display=t.includes(val)?"block":"none";
    });
}

/* theme */
function toggleTheme(){
    document.body.classList.toggle("dark");
}

/* particles (basit) */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let w,h;

function resize(){
    w=canvas.width=innerWidth;
    h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let p=[];
for(let i=0;i<60;i++){
    p.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2});
}

function anim(){
    ctx.clearRect(0,0,w,h);
    for(let o of p){
        o.y+=0.3;
        if(o.y>h)o.y=0;

        ctx.beginPath();
        ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.6)";
        ctx.fill();
    }
    requestAnimationFrame(anim);
}
anim();

render();
</script>

</body>
</html>
