
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
}

body.dark{
    --bg1:#121212;
    --bg2:#1f1f1f;
    --text:#f5f5f5;
    --card:#2a2a2a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia, serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:35px 15px;
    text-align:center;
    overflow-x:hidden;
    transition:.4s;
}

/* overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(7px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:500;
}

body.modal-open .overlay{
    opacity:1;
    pointer-events:auto;
}

/* particles */
#particles{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* title */
h1{
    font-size:2.3em;
    margin-bottom:10px;
}

.quote{
    font-style:italic;
    margin-bottom:22px;
    opacity:.85;
    line-height:1.7;
    font-size:18px;
}

/* controls */
.controls{
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,input{
    padding:10px 14px;
    border:none;
    border-radius:12px;
    font-size:15px;
    outline:none;
}

button{
    cursor:pointer;
    background:var(--card);
    color:var(--text);
    transition:.25s;
}

button:hover{
    transform:translateY(-3px);
}

input{
    width:230px;
}

/* grid */
.poem-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    max-width:950px;
    margin:auto;
}

/* card */
.poem-card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
    overflow:hidden;
    position:relative;
}

.poem-card:hover{
    transform:translateY(-5px);
}

.poem-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:22px;
}

.arrow{
    transition:.4s;
}

.poem-card.open .arrow{
    transform:rotate(180deg);
}

/* active modal */
.poem-card.active{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(92%,520px);
    z-index:999;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
}

/* text */
.poem-text{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(-10px);
    transition:.5s;
    line-height:1.9;
    white-space:pre-line;
}

.poem-card.open .poem-text{
    max-height:500px;
    opacity:1;
    transform:translateY(0);
    padding-top:14px;
}

/* AUDIO ORTALI */
.audio-wrap{
    display:flex;
    justify-content:center;
    margin-top:15px;
}

audio{
    width:100%;
    max-width:320px;
    display:none;
}

.poem-card.open audio{
    display:block;
}

/* mobile */
@media(max-width:600px){

    body{
        padding:22px 12px;
    }

    h1{
        font-size:1.9em;
    }

    .poem-container{
        grid-template-columns:1fr;
    }

    input,button{
        width:100%;
    }

    .controls{
        flex-direction:column;
    }

    audio{
        max-width:100%;
    }
}
</style>
</head>

<body>

<div class="overlay" onclick="closeCard()"></div>
<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="quote">
Değerle düşün, Bilimle üret, Doğayla yaşa!
</div>

<div class="controls">
    <button onclick="randomSiir()">🎲 Rastgele</button>
    <input id="search" placeholder="Şiir ara..." onkeyup="filterPoems()">
    <button onclick="tema('light')">☀️</button>
    <button onclick="tema('dark')">🌙</button>
</div>

<div class="poem-container" id="list"></div>

<script>
const siirler = [
{
baslik:"Şiir 1",
metin:`Kalbimde sessiz bir rüzgar,
Geceye düşer hatıralar.`,
ses:"sesler/siir1.mp3"
},
{
baslik:"Şiir 2",
metin:`Yollar uzun, gözler yorgun,
Aşk yine bana vurgun.`,
ses:"sesler/siir2.mp3"
},
{
baslik:"Şiir 3",
metin:`Deniz kadar derin sustum,
Adını içimde duydum.`,
ses:"sesler/siir3.mp3"
},
{
baslik:"Şiir 4",
metin:`Bir yıldız kaydı geceden,
Ben geçemedim senden.`,
ses:"sesler/siir4.mp3"
},
{
baslik:"Şiir 5",
metin:`Zaman geçer iz bırakır,
Giden kalpte sızı yakar.`,
ses:"sesler/siir5.mp3"
}
];

const list = document.getElementById("list");

function render(){
    list.innerHTML="";

    siirler.forEach((s,i)=>{
        list.innerHTML += `
        <div class="poem-card" data-title="${s.baslik}" id="card-${i}">
            <div class="poem-title" onclick="toggleCard(${i})">
                <span>${s.baslik}</span>
                <span class="arrow">⌄</span>
            </div>

            <div class="poem-text">${s.metin}</div>

            <div class="audio-wrap">
                <audio controls preload="none">
                    <source src="${s.ses}" type="audio/mpeg">
                </audio>
            </div>
        </div>`;
    });
}

function stopAllAudio(){
    document.querySelectorAll("audio").forEach(a=>{
        a.pause();
        a.currentTime=0;
    });
}

function closeCard(){
    document.querySelectorAll(".poem-card").forEach(card=>{
        card.classList.remove("open","active");
    });

    document.body.classList.remove("modal-open");
    stopAllAudio();
}

function toggleCard(i){

    let card = document.getElementById("card-"+i);
    let alreadyOpen = card.classList.contains("active");

    closeCard();

    if(!alreadyOpen){
        card.classList.add("open","active");
        document.body.classList.add("modal-open");
    }
}

function randomSiir(){
    let i = Math.floor(Math.random()*siirler.length);
    toggleCard(i);
}

function filterPoems(){
    let val = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".poem-card").forEach(card=>{
        let t = card.dataset.title.toLowerCase();
        card.style.display = t.includes(val) ? "block" : "none";
    });
}

function tema(t){
    document.body.classList.remove("dark");
    if(t==="dark") document.body.classList.add("dark");
}

document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeCard();
});

render();

/* particles */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

let w,h;
let particles=[];

function resize(){
    w=canvas.width=innerWidth;
    h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

for(let i=0;i<90;i++){
    particles.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*2+1,
        dx:(Math.random()-.5)*0.5,
        dy:(Math.random()-.5)*0.5
    });
}

function animate(){
    ctx.clearRect(0,0,w,h);

    for(let p of particles){

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>w)p.dx*=-1;
        if(p.y<0||p.y>h)p.dy*=-1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

        ctx.fillStyle=document.body.classList.contains("dark")
        ? "rgba(255,255,255,.7)"
        : "rgba(255,255,255,.9)";

        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
