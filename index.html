<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
}

body.dark{
    --bg1:#121212;
    --bg2:#1f1f1f;
    --text:#f5f5f5;
    --card:#2a2a2a;
}

body.parchment{
    --bg1:#f4ecd8;
    --bg2:#e8dcc0;
    --text:#3b2f2f;
    --card:#fff8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia, serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:35px 15px;
    text-align:center;
    overflow-x:hidden;
    transition:.4s;
}

/* PARTICLES */
#particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* TITLE */
h1{
    font-size:2.3em;
    margin-bottom:10px;
}

.quote{
    font-style:italic;
    margin-bottom:22px;
    opacity:.8;
    line-height:1.7;
}

/* CONTROLS */
.controls{
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,select,input{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

button{
    cursor:pointer;
    background:var(--card);
    color:var(--text);
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

input{
    width:230px;
}

/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    max-width:950px;
    margin:auto;
}

/* CARD */
.poem-card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
    overflow:hidden;
}

.poem-card:hover{
    transform:translateY(-5px);
}

.poem-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:22px;
}

.arrow{
    transition:.4s;
}

.poem-card.open .arrow{
    transform:rotate(180deg);
}

/* TEXT */
.poem-text{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(-10px);
    transition:max-height .6s ease, opacity .4s ease, transform .4s ease;
    line-height:1.8;
    white-space:pre-line;
}

.poem-card.open .poem-text{
    max-height:500px;
    opacity:1;
    transform:translateY(0);
    padding-top:14px;
}

/* MOBILE */
@media(max-width:600px){

    body{
        padding:22px 12px;
    }

    h1{
        font-size:1.9em;
    }

    .poem-container{
        grid-template-columns:1fr;
    }

    input{
        width:100%;
    }

    button{
        width:100%;
    }

    .controls{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.”<br>
— Yunus Emre
</div>

<div class="controls">
    <button onclick="randomSiir()">🎲 Rastgele</button>

    <input id="search" placeholder="Şiir ara..." onkeyup="filterPoems()">

    <select onchange="degistirHiz(this.value)">
        <option value="1">Normal</option>
        <option value="1.25">Hızlı</option>
        <option value="0.75">Yavaş</option>
    </select>

    <button onclick="tema('light')">☀️</button>
    <button onclick="tema('dark')">🌙</button>
    <button onclick="tema('parchment')">📜</button>
</div>

<div class="poem-container" id="list"></div>

<script>
const siirler = [
{
baslik:"Şiir 1",
metin:`Kalbimde sessiz bir rüzgar,
Geceye düşer hatıralar.`
},
{
baslik:"Şiir 2",
metin:`Yollar uzun, gözler yorgun,
Aşk yine bana vurgun.`
},
{
baslik:"Şiir 3",
metin:`Deniz kadar derin sustum,
Adını içimde duydum.`
},
{
baslik:"Şiir 4",
metin:`Bir yıldız kaydı geceden,
Ben geçemedim senden.`
},
{
baslik:"Şiir 5",
metin:`Zaman geçer iz bırakır,
Giden kalpte sızı yakar.`
}
];

let currentSpeed = 1;
const list = document.getElementById("list");

function render(){
    list.innerHTML = "";

    siirler.forEach((s,i)=>{
        list.innerHTML += `
        <div class="poem-card" data-title="${s.baslik}" id="card-${i}">
            <div class="poem-title" onclick="toggleCard(${i})">
                <span>${s.baslik}</span>
                <span class="arrow">⌄</span>
            </div>

            <div class="poem-text">${s.metin}</div>
        </div>`;
    });
}

function toggleCard(i){
    document.getElementById("card-"+i).classList.toggle("open");
}

function randomSiir(){
    let i = Math.floor(Math.random()*siirler.length);

    document.querySelectorAll(".poem-card").forEach(x=>{
        x.classList.remove("open");
    });

    let sec = document.getElementById("card-"+i);
    sec.classList.add("open");

    sec.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });
}

function filterPoems(){
    let val = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".poem-card").forEach(card=>{
        let t = card.dataset.title.toLowerCase();
        card.style.display = t.includes(val) ? "block" : "none";
    });
}

function degistirHiz(v){
    currentSpeed = v;
}

function tema(t){
    document.body.classList.remove("dark","parchment");

    if(t==="dark") document.body.classList.add("dark");
    if(t==="parchment") document.body.classList.add("parchment");
}

render();

/* PARTICLES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let w,h;
let particles=[];

function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

for(let i=0;i<90;i++){
    particles.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*2+1,
        dx:(Math.random()-0.5)*0.5,
        dy:(Math.random()-0.5)*0.5
    });
}

function animate(){
    ctx.clearRect(0,0,w,h);

    for(let p of particles){

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0 || p.x>w) p.dx *= -1;
        if(p.y<0 || p.y>h) p.dy *= -1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

        if(document.body.classList.contains("dark")){
            ctx.fillStyle="rgba(255,255,255,.7)";
        }else{
            ctx.fillStyle="rgba(255,255,255,.9)";
        }

        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
