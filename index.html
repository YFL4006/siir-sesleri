<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background:linear-gradient(135deg,#fdf6e3,#f5e6ca);
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
    overflow-x:hidden;
}

/* DARK MODE */
body.dark{
    background:linear-gradient(135deg,#1e1e1e,#2a2a2a);
    color:#eee;
}

body.dark .poem-card{
    background:#2a2a2a;
    box-shadow:0 0 15px rgba(255,255,255,0.05);
}

body.dark .poem-title,
body.dark .arrow{
    color:#f5f5f5;
}

/* PARTICLE CANVAS */
#particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
}

/* CARD */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    transition:0.3s;
    cursor:pointer;
}
.poem-card:hover{
    transform:scale(1.03);
}

.poem-title{
    display:flex;
    justify-content:center;
    gap:10px;
}

.arrow{transition:0.3s;}

.poem-text{
    display:none;
    margin-top:10px;
    opacity:0;
    transition:0.3s;
}
.poem-text.active{
    display:block;
    opacity:1;
}

/* MODAL */
.poem-card.active-focus{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:700px;
    z-index:1000;
}

/* OVERLAY */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    top:0;
    left:0;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
}
.overlay.active{
    opacity:1;
    pointer-events:auto;
}

/* MOBİL */
@media(max-width:600px){
    .poem-container{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="controls">
    <button onclick="randomSiir()">✨ Rastgele Şiir</button>

    <select onchange="degistirHiz(this.value)">
        <option value="1">🎧 Normal</option>
        <option value="1.25">⚡ Hızlı</option>
        <option value="0.75">🐢 Yavaş</option>
    </select>

    <button onclick="tema('light')">🌼</button>
    <button onclick="tema('dark')">🌙</button>
</div>

<div class="poem-container"></div>
<div class="overlay" id="overlay"></div>

<script>
let currentAudio=null;
let currentIndex=1;

/* KART */
function kart(no){
    document.querySelector('.poem-container').innerHTML += `
    <div class="poem-card">
        <h2 class="poem-title" onclick="siirGoster(event,${no})">
