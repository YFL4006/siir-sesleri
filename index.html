<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
}

body.dark{
    --bg1:#121212;
    --bg2:#1f1f1f;
    --text:#f5f5f5;
    --card:#2a2a2a;
}

body{
    font-family:Georgia, serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:35px 15px;
    text-align:center;
    transition:.4s;
}

*{margin:0;padding:0;box-sizing:border-box;}

#particles{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* grid */
.poem-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    max-width:950px;
    margin:auto;
}

/* CARD */
.poem-card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:transform .25s;
    cursor:pointer;
}

.poem-card:hover{
    transform:translateY(-5px);
}

.poem-name{
    font-size:22px;
    font-weight:bold;
}

/* 🔥 SPRING + BLUR FADE */
.poem-text{
    margin-top:10px;

    opacity:0;
    transform:translateY(-18px) scale(.92);
    filter:blur(8px);

    transition:
        opacity .45s cubic-bezier(.2,1,.2,1),
        transform .55s cubic-bezier(.2,1.4,.2,1),
        filter .5s ease;

    pointer-events:none;
}

/* OPEN STATE */
.poem-card.open .poem-text{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
    pointer-events:auto;

    /* glow hissi */
    text-shadow:0 0 10px rgba(255,200,120,.15);
}

/* ACTIVE CARD (modal hissi) */
.poem-card.active{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.9);
    width:min(92%,520px);
    z-index:999;

    animation:springIn .55s cubic-bezier(.2,1.5,.2,1) forwards;
}

/* 🌀 SPRING ANIMATION */
@keyframes springIn{
    0%{
        transform:translate(-50%,-50%) scale(.85);
        opacity:0;
        filter:blur(10px);
    }
    60%{
        transform:translate(-50%,-50%) scale(1.03);
        opacity:1;
        filter:blur(0);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* controls */
.controls{
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,input{
    padding:10px 14px;
    border:none;
    border-radius:12px;
}

button{
    cursor:pointer;
    background:var(--card);
    transition:.25s;
}

button:active{transform:scale(.92);}

input{width:230px;}

@media(max-width:600px){
    .poem-container{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="controls">
    <button onclick="randomSiir()">🎲 Rastgele</button>
    <button onclick="toggleTheme()">🌙</button>
</div>

<div class="poem-container" id="list"></div>

<script>
const siirler=[
{baslik:"Şiir 1",metin:"Kalbimde sessiz bir rüzgar"},
{baslik:"Şiir 2",metin:"Yollar uzun, gözler yorgun"},
{baslik:"Şiir 3",metin:"Deniz kadar derin sustum"},
{baslik:"Şiir 4",metin:"Bir yıldız kaydı geceden"},
{baslik:"Şiir 5",metin:"Zaman geçer iz bırakır"}
];

const list=document.getElementById("list");

/* render */
function render(){
    list.innerHTML="";
    siirler.forEach((s,i)=>{
        list.innerHTML+=`
        <div class="poem-card" id="card-${i}" onclick="toggleCard(${i})">
            <div class="poem-name">${s.baslik}</div>
            <div class="poem-text">${s.metin}</div>
        </div>`;
    });
}

/* close */
function closeAll(){
    document.querySelectorAll(".poem-card")
    .forEach(c=>c.classList.remove("open","active"));
}

/* toggle */
function toggleCard(i){
    let card=document.getElementById("card-"+i);
    let open=card.classList.contains("active");

    closeAll();

    if(!open){
        card.classList.add("open","active");
    }
}

/* random */
function randomSiir(){
    let i=Math.floor(Math.random()*siirler.length);
    toggleCard(i);
}

/* theme */
function toggleTheme(){
    document.body.classList.toggle("dark");
}

render();
</script>

</body>
</html>
