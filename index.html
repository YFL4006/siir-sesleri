<!DOCTYPE html>  <html lang="tr">    <head>      <meta charset="UTF-8">        <meta name="viewport" content="width=device-width, initial-scale=1.0">          <title>Şiir Sesleri</title>  <style>          
:root{          
    --bg1:#fdf6e3;          
    --bg2:#f5e6ca;          
    --text:#3b2f2f;          
    --card:#fff8f0;          
    --accent:#ff8c00;          
}    
body.dark{      
--bg1:#121212;      
--bg2:#1f1f1f;      
--text:#f5f5f5;      
--card:#2a2a2a;      
}  

body{    
font-family:Georgia, serif;    
background:linear-gradient(135deg,var(--bg1),var(--bg2));    
color:var(--text);    
min-height:100vh;    
padding:35px 15px;    
text-align:center;    
overflow-x:hidden;    
transition:.5s;    
}  

*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
}  

/* === PLAYER FIX START === */

.audio-player{
margin-top:14px;
padding:14px;
border-radius:14px;
transition:.3s;
display:flex;
flex-direction:column;
gap:10px;
}

.audio-player.playing{
background:rgba(255,140,0,0.10);
box-shadow:0 0 22px rgba(255,140,0,0.35);
}

.audio-controls{
display:flex;
align-items:center;
gap:10px;
width:100%;
}

.play-btn{
background:var(--accent);
color:white;
border-radius:50%;
width:44px;
height:44px;
font-size:16px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

.play-btn:hover{
transform:scale(1.08);
}

.progress{
width:100%;
accent-color:var(--accent);
height:6px;
border-radius:10px;
cursor:pointer;
}

/* === PLAYER FIX END === */

/* geri kalan CSS aynen korundu */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.25);
backdrop-filter:blur(7px);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:500;
}

body.modal-open .overlay{
opacity:1;
pointer-events:auto;
}

#particles{
position:fixed;
inset:0;
z-index:-1;
}

h1{
font-size:2.5em;
margin-bottom:10px;
}

.quote{
font-style:italic;
margin-bottom:25px;
opacity:.85;
font-size:18px;
}

.controls{
margin-bottom:30px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button,input{
padding:10px 14px;
border:none;
border-radius:12px;
font-size:15px;
}

button{
cursor:pointer;
background:var(--card);
color:var(--text);
transition:.25s;
}

button:hover{
transform:translateY(-3px);
}

button:active{
transform:scale(0.9);
}

button.random-animate{
animation:shake .4s;
}

@keyframes shake{
0%{transform:rotate(0)}
25%{transform:rotate(-6deg)}
50%{transform:rotate(6deg)}
75%{transform:rotate(-4deg)}
100%{transform:rotate(0)}
}

input{
width:230px;
}

.poem-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
max-width:1100px;
margin:auto;
}

.poem-card{
background:var(--card);
border-radius:18px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.3s;
}

.poem-card:hover{
transform:translateY(-5px);
}

.poem-card.highlight{
transform:scale(1.05);
box-shadow:0 0 25px rgba(255,140,0,.5);
}

.poem-header{
cursor:pointer;
}

.poem-name{
font-size:24px;
font-weight:bold;
margin-bottom:8px;
}

.poem-text{
max-height:0;
opacity:0;
overflow:hidden;
transition:.4s;
white-space:pre-line;
line-height:1.7;
}

.poem-card.open .poem-text{
max-height:500px;
opacity:1;
padding-top:10px;
}

.poem-card.active{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:min(92%,520px);
z-index:999;
animation:popup .3s ease;
}

@keyframes popup{
from{transform:translate(-50%,-50%) scale(.8);}
to{transform:translate(-50%,-50%) scale(1);}
}
</style>  </head>  <body>  

<div class="overlay" onclick="closeCard()"></div>
<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="quote">
Değerle düşün, Bilimle üret, Doğayla yaşa!
</div>

<div class="controls">          
<button id="randomBtn" onclick="randomSiir()">🎲 Rastgele</button>  
<input id="search" placeholder="Şiir ara..." onkeyup="filterPoems()">  
<button id="themeBtn" onclick="toggleTheme()">🌙</button>  
</div>  

<div class="poem-container" id="list"></div>  

<script>

const siirler=[
{baslik:"Şiir 1",metin:`Kalbimde sessiz bir rüzgar,
Geceye düşer hatıralar.`,ses:"ses1.mp3"},
{baslik:"Şiir 2",metin:`Yollar uzun, gözler yorgun,
Aşk yine bana vurgun.`,ses:"ses2.mp3"},
{baslik:"Şiir 3",metin:`Deniz kadar derin sustum,
Adını içimde duydum.`,ses:"ses3.mp3"}
];

const list=document.getElementById("list");
const themeBtn=document.getElementById("themeBtn");

function render(){
list.innerHTML="";
siirler.forEach((s,i)=>{
list.innerHTML+=`
<div class="poem-card" id="card-${i}">
<div class="poem-header" onclick="toggleCard(${i})">
<div class="poem-name">${s.baslik}</div>
</div>

<div class="poem-text">
${s.metin}

<div class="audio-player">
<div class="audio-controls">

<button class="play-btn" onclick="playAudio(${i},this)">▶️</button>

<input type="range" class="progress" value="0" min="0" step="1" onchange="seek(${i},this)">

</div>
<audio id="audio-${i}" src="${s.ses}"></audio>
</div>

</div>
</div>`;
});
}

/* === AUDIO (DEĞİŞMEDİ) === */

function playAudio(i,btn){

let audio=document.getElementById("audio-"+i);
let player=btn.closest(".audio-player");

document.querySelectorAll("audio").forEach(a=>{
if(a!==audio){a.pause();a.currentTime=0;}
});

document.querySelectorAll(".play-btn").forEach(b=>{
if(b!==btn){b.innerText="▶️";}
});

document.querySelectorAll(".audio-player").forEach(p=>{
if(p!==player){p.classList.remove("playing");}
});

if(audio.paused){
audio.play();
btn.innerText="⏸";
player.classList.add("playing");
}else{
audio.pause();
btn.innerText="▶️";
player.classList.remove("playing");
}

audio.ontimeupdate=()=>{
let progress=btn.parentElement.querySelector(".progress");
progress.max=audio.duration;
progress.value=audio.currentTime;
};

audio.onended=()=>{
btn.innerText="▶️";
player.classList.remove("playing");
};
}

function seek(i,range){
document.getElementById("audio-"+i).currentTime=range.value;
}

render();

</script>
</body>
</html>
