<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
    --accent:#ff8c00;
}

body.dark{
--bg1:#121212;
--bg2:#1f1f1f;
--text:#f5f5f5;
--card:#2a2a2a;
}

body{
font-family:Georgia, serif;
background:linear-gradient(135deg,var(--bg1),var(--bg2));
color:var(--text);
min-height:100vh;
padding:35px 15px;
text-align:center;
overflow-x:hidden;
transition:.5s;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.25);
backdrop-filter:blur(7px);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:500;
}

body.modal-open .overlay{
opacity:1;
pointer-events:auto;
}

#particles{
position:fixed;
inset:0;
z-index:-1;
}

h1{
font-size:2.5em;
margin-bottom:10px;
}

.quote{
font-style:italic;
margin-bottom:25px;
opacity:.85;
font-size:18px;
}

.controls{
margin-bottom:30px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button,input{
padding:10px 14px;
border:none;
border-radius:12px;
font-size:15px;
}

button{
cursor:pointer;
background:var(--card);
color:var(--text);
transition:.25s;
}

button:hover{
transform:translateY(-3px);
}

button:active{
transform:scale(0.9);
}

button.random-animate{
animation:shake .4s;
}

@keyframes shake{
0%{transform:rotate(0)}
25%{transform:rotate(-6deg)}
50%{transform:rotate(6deg)}
75%{transform:rotate(-4deg)}
100%{transform:rotate(0)}
}

input{
width:230px;
}

.poem-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
max-width:1100px;
margin:auto;
}

.poem-card{
background:var(--card);
border-radius:18px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.3s;
}

.poem-card:hover{
transform:translateY(-5px);
}

.poem-card.highlight{
transform:scale(1.05);
box-shadow:0 0 25px rgba(255,140,0,.5);
}

.poem-header{
cursor:pointer;
}

.poem-name{
font-size:24px;
font-weight:bold;
margin-bottom:8px;
}

.poem-text{
max-height:0;
opacity:0;
overflow:hidden;
transition:.4s;
white-space:pre-line;
line-height:1.7;
}

.poem-card.open .poem-text{
max-height:500px;
opacity:1;
padding-top:10px;
}

.poem-card.active{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:min(92%,520px);
z-index:999;
animation:popup .3s ease;
}

@keyframes popup{
from{
transform:translate(-50%,-50%) scale(.8);
}
to{
transform:translate(-50%,-50%) scale(1);
}
}

/* PLAYER */
.audio-player{
margin-top:14px;
padding:10px;
border-radius:12px;
transition:.3s;
}

.audio-player.playing{
background:rgba(255,140,0,0.08);
box-shadow:0 0 18px rgba(255,140,0,0.4);
}

.audio-controls{
display:flex;
align-items:center;
gap:8px;
}

.play-btn{
background:var(--accent);
color:white;
border-radius:50%;
width:40px;
height:40px;
font-size:16px;
cursor:pointer;
}

.progress{
width:100%;
accent-color:var(--accent);
}

/* ===== SADECE EKLENDİ - HİÇBİR ŞEY SİLİNMEDİ ===== */

.audio-controls{
    align-items:center;
    width:100%;
}

.progress{
    flex:1;
    min-width:0;
    height:4px;
}

.play-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    line-height:0;
    box-shadow:none;
}
</style>

</head>

<body>

<div class="overlay" onclick="closeCard()"></div>
<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="quote">
Değerle düşün, Bilimle üret, Doğayla yaşa!
</div>

<div class="controls">
<button id="randomBtn" onclick="randomSiir()">🎲 Rastgele</button>

<input id="search"8 placeholder="Şiir ara..." onkeyup="filterPoems()">

<button id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>

<div class="poem-container" id="list"></div>
