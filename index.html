
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
:root{
    --bg1:#fdf6e3;
    --bg2:#f5e6ca;
    --text:#3b2f2f;
    --card:#fff8f0;
    --accent:#ff8c00;
}

body.dark{
    --bg1:#121212;
    --bg2:#1f1f1f;
    --text:#f5f5f5;
    --card:#2a2a2a;
}

body{
    font-family:Georgia, serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    min-height:100vh;
    padding:35px 15px;
    text-align:center;
    overflow-x:hidden;
    transition:.5s;
}

*{margin:0;padding:0;box-sizing:border-box;}

.overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(7px);
    opacity:0; pointer-events:none;
    transition:.3s; z-index:500;
}
body.modal-open .overlay{
    opacity:1; pointer-events:auto;
}

#particles{position:fixed; inset:0; z-index:-1;}

.controls{
    margin-bottom:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,input{
    padding:10px 14px;
    border:none;
    border-radius:12px;
    font-size:15px;
}

button{
    cursor:pointer;
    background:var(--card);
    color:var(--text);
    transition:.25s;
}

button:hover{transform:translateY(-3px);}
button:active{transform:scale(.9);}

.poem-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    max-width:950px;
    margin:auto;
}

.poem-card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
}

.poem-header{cursor:pointer;}
.poem-name{font-size:24px;font-weight:bold;}

.poem-text{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:.4s;
    white-space:pre-line;
}

.poem-card.open .poem-text{
    max-height:500px;
    opacity:1;
    padding-top:10px;
}

/* modal */
.poem-card.active{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(92%,520px);
    z-index:999;
}

/* 🎧 PLAYER */
.audio-player{
    margin-top:15px;
    padding:10px;
    border-radius:14px;
    transition:.4s;
}

/* ✨ GLOW AKTİF */
.audio-player.playing{
    background:rgba(255,140,0,0.08);
    box-shadow:
        0 0 10px rgba(255,140,0,0.3),
        0 0 25px rgba(255,140,0,0.25),
        inset 0 0 10px rgba(255,140,0,0.2);
    animation:softPulse 2s infinite ease-in-out;
}

@keyframes softPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.015);}
}

.audio-controls{
    display:flex;
    align-items:center;
    gap:10px;
}

/* 🔘 PLAY BUTON GLOW */
.play-btn{
    background:var(--accent);
    color:white;
    border-radius:50%;
    width:48px;height:48px;
    font-size:18px;
    box-shadow:0 0 10px rgba(255,140,0,0.5);
    transition:.3s;
}

.audio-player.playing .play-btn{
    animation:btnPulse 1.2s infinite;
}

@keyframes btnPulse{
    0%{box-shadow:0 0 10px rgba(255,140,0,0.5);}
    50%{box-shadow:0 0 25px rgba(255,140,0,0.9);}
    100%{box-shadow:0 0 10px rgba(255,140,0,0.5);}
}

.play-btn:hover{
    transform:scale(1.1);
}

/* slider */
.progress{
    width:100%;
    accent-color:var(--accent);
}

</style>
</head>

<body>

<div class="overlay" onclick="closeCard()"></div>
<canvas id="particles"></canvas>

<h1>Şiir Sesleri</h1>

<div class="controls">
    <button onclick="randomSiir()">🎲</button>
    <input id="search" placeholder="Şiir ara..." onkeyup="filterPoems()">
    <button onclick="toggleTheme()">🌙</button>
</div>

<div class="poem-container" id="list"></div>

<script>
const siirler=[
{
baslik:"Şiir 1",
metin:`Kalbimde sessiz bir rüzgar,\nGeceye düşer hatıralar.`,
ses:"ses1.mp3"
},
{
baslik:"Şiir 2",
metin:`Yollar uzun, gözler yorgun,\nAşk yine bana vurgun.`,
ses:"ses2.mp3"
}
];

const list=document.getElementById("list");

function render(){
list.innerHTML="";
siirler.forEach((s,i)=>{
list.innerHTML+=`
<div class="poem-card" id="card-${i}">
    <div class="poem-header" onclick="toggleCard(${i})">
        <div class="poem-name">${s.baslik}</div>
    </div>

    <div class="poem-text">
        ${s.metin}

        <div class="audio-player">
            <div class="audio-controls">
                <button class="play-btn" onclick="playAudio(${i},this)">▶️</button>
                <input type="range" class="progress" value="0" min="0" step="1" onchange="seek(${i},this)">
            </div>
            <audio id="audio-${i}" src="${s.ses}"></audio>
        </div>
    </div>
</div>`;
});
}

function toggleCard(i){
closeCard();
let card=document.getElementById("card-"+i);
card.classList.add("open","active");
document.body.classList.add("modal-open");
}

function closeCard(){
document.querySelectorAll(".poem-card").forEach(c=>{
c.classList.remove("open","active");
});
document.body.classList.remove("modal-open");

document.querySelectorAll("audio").forEach(a=>{
a.pause();
a.currentTime=0;
});

document.querySelectorAll(".audio-player").forEach(p=>{
p.classList.remove("playing");
});
}

function playAudio(i,btn){
let audio=document.getElementById("audio-"+i);
let player=btn.closest(".audio-player");

if(audio.paused){
audio.play();
btn.innerText="⏸";
player.classList.add("playing");
}else{
audio.pause();
btn.innerText="▶️";
player.classList.remove("playing");
}

audio.ontimeupdate=()=>{
let progress=btn.parentElement.querySelector(".progress");
progress.max=audio.duration;
progress.value=audio.currentTime;
}

audio.onended=()=>{
btn.innerText="▶️";
player.classList.remove("playing");
}
}

function seek(i,range){
let audio=document.getElementById("audio-"+i);
audio.currentTime=range.value;
}

function randomSiir(){
let i=Math.floor(Math.random()*siirler.length);
toggleCard(i);
}

function filterPoems(){
let val=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".poem-card").forEach(card=>{
let t=card.innerText.toLowerCase();
card.style.display=t.includes(val)?"block":"none";
});
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

render();

/* particles */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let w,h,p=[];

function resize(){
w=canvas.width=innerWidth;
h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

for(let i=0;i<60;i++){
p.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2,dx:(Math.random()-.5)*.5,dy:(Math.random()-.5)*.5});
}

function animate(){
ctx.clearRect(0,0,w,h);
for(let i of p){
i.x+=i.dx;i.y+=i.dy;
if(i.x<0||i.x>w)i.dx*=-1;
if(i.y<0||i.y>h)i.dy*=-1;
ctx.beginPath();
ctx.arc(i.x,i.y,i.r,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,.8)";
ctx.fill();
}
requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
