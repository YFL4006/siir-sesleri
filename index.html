<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şiir Sesleri</title>
  <style>
    /* Genel stil */
    body {
      background-color: #fdf6e3; /* pastel kağıt rengi */
      font-family: 'Georgia', serif;
      color: #333;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Sol dekor (leaves) */
    .left-decor {
      position: fixed;
      top: 0;
      left: 0;
      width: 120px;
      height: 100%;
      opacity: 0.2;
      z-index: 0;
      background-image: url('dekorasyon/left_leaves.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: top;
    }

    /* Sağ dekor (sarmaşık) */
    .right-decor {
      position: fixed;
      top: 0;
      right: 0;
      width: 120px;
      height: 100%;
      opacity: 0.2;
      z-index: 0;
      background-image: url('dekorasyon/right_plant.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: top;
    }

    /* Başlık */
    h1 {
      font-size: 3em;
      margin-bottom: 40px;
      font-style: italic;
      color: #5a3e36;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }

    /* Şiir kartı */
    .poem-card {
      background-color: #fff8f0;
      border: 1px solid #e2d8c3;
      border-radius: 12px;
      width: 340px;
      margin: 0 auto;
      padding: 30px 25px;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      z-index: 1;
    }
    .poem-card:hover {
      transform: scale(1.03);
      box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
    }

    h2 {
      font-size: 1.6em;
      margin-bottom: 20px;
      color: #6b4c3b;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    footer {
      margin-top: 50px;
      font-size: 0.95em;
      color: #888;
      position: relative;
      z-index: 1;
    }

    /* Responsive */
    @media screen and (max-width: 500px) {
      .poem-card { width: 90%; padding: 20px; }
      h1 { font-size: 2.2em; }
      h2 { font-size: 1.3em; }
      .left-decor, .right-decor { width: 60px; }
    }
  </style>
</head>
<body>

  <!-- Dekorasyonlar -->
  <div class="left-decor"></div>
  <div class="right-decor"></div>

  <!-- Başlık -->
  <h1>Şiir Sesleri</h1>

  <!-- Şiir Kartı -->
  <div class="poem-card">
    <h2>İstiklal Marşı</h2>
    <audio controls>
      <source src="siirler/istiklalmarsi.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- Alt bilgi -->
  <footer>Yunus Emre ruhunu anan şiir sesleri</footer>

</body>
</html>
