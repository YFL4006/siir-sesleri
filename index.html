<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:40px 15px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
    transition:0.3s;
}

/* TEMALAR */
body.dark{
    background:#1e1e1e;
    color:#eee;
}
body.parchment{
    background:#f4ecd8;
}

/* ARKA PLAN */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90vw;
    height:90vw;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.12;
    z-index:-1;
    transition:transform 0.1s;
}

h1{font-size:2em;}

.controls{
    margin-bottom:20px;
}

button, select{
    padding:8px 12px;
    margin:5px;
    border-radius:8px;
    border:none;
    cursor:pointer;
}

/* GRID */
.poem-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    max-width:900px;
    margin:auto;
}

/* CARD */
.poem-card{
    background:#fff8f0;
    padding:20px;
    border-radius:14px;
    transition:0.3s;
    cursor:pointer;
}
.poem-card:hover{
    transform:scale(1.03);
}

/* MODAL */
.poem-card.active-focus{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:700px;
    z-index:1000;
    background:#fff8f0;
}

.poem-text{
    display:none;
    margin-top:10px;
}
.poem-text.active{
    display:block;
}

audio{width:100%;}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    top:0;
    left:0;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
}
.overlay.active{
    opacity:1;
    pointer-events:auto;
}

/* MOBİL */
@media(max-width:600px){
    .poem-container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>Şiir Sesleri</h1>

<div class="controls">
    <button onclick="randomSiir()">🎲 Rastgele</button>

    <select onchange="degistirHiz(this.value)">
        <option value="1">Normal</option>
        <option value="1.25">Hızlı</option>
        <option value="0.75">Yavaş</option>
    </select>

    <button onclick="tema('light')">☀️</button>
    <button onclick="tema('dark')">🌙</button>
    <button onclick="tema('parchment')">📜</button>
</div>

<div class="poem-container"></div>
<div class="overlay" id="overlay"></div>

<script>
let currentAudio = null;

/* KART */
function kart(no){
    document.querySelector('.poem-container').innerHTML += `
    <div class="poem-card">
        <h2 onclick="siirGoster(event,${no})">Şiir ${no}</h2>
        <div id="siir${no}" class="poem-text">
            <audio id="audio${no}" controls>
                <source src="siir${no}.mp3">
            </audio>
            Şiir metni...
        </div>
    </div>`;
}
for(let i=1;i<=10;i++){kart(i);}

/* AÇ */
function siirGoster(e,no){
    let overlay=document.getElementById("overlay");

    document.querySelectorAll(".poem-text").forEach(el=>{
        el.classList.remove("active");
    });

    document.querySelectorAll(".poem-card").forEach(c=>{
        c.classList.remove("active-focus");
    });

    let siir=document.getElementById("siir"+no);
    let card=siir.parentElement;
    let audio=document.getElementById("audio"+no);

    siir.classList.add("active");
    card.classList.add("active-focus");
    overlay.classList.add("active");

    if(currentAudio){
        currentAudio.pause();
        currentAudio.currentTime=0;
    }

    currentAudio=audio;
}

/* KAPAT */
document.getElementById("overlay").onclick=()=>{
    document.querySelectorAll(".poem-text").forEach(el=>{
        el.classList.remove("active");
    });
    document.querySelectorAll(".poem-card").forEach(c=>{
        c.classList.remove("active-focus");
    });
    document.getElementById("overlay").classList.remove("active");

    if(currentAudio){
        currentAudio.pause();
    }
}

/* 🎲 RANDOM */
function randomSiir(){
    let no=Math.floor(Math.random()*10)+1;
    siirGoster(new Event('click'),no);
}

/* 🎧 SPEED */
function degistirHiz(hiz){
    if(currentAudio){
        currentAudio.playbackRate=hiz;
    }
}

/* 🎨 TEMA */
function tema(t){
    document.body.classList.remove("dark","parchment");
    if(t==="dark") document.body.classList.add("dark");
    if(t==="parchment") document.body.classList.add("parchment");
}

/* 🌀 PARALLAX */
document.addEventListener("mousemove", e=>{
    let x=(e.clientX/window.innerWidth-0.5)*20;
    let y=(e.clientY/window.innerHeight-0.5)*20;

    document.body.style.setProperty('--x', x+'px');
    document.body.style.setProperty('--y', y+'px');

    document.body.style.backgroundPosition = `${50+x/5}% ${50+y/5}%`;

    document.body.style.transform = `translate(${x/50}px,${y/50}px)`;
});
</script>

</body>
</html>
