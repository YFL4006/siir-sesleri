<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:60px 20px;
    background-color:#fdf6e3;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
    transition:0.4s;
}

/* GECE MODU */
body.dark{
    background-color:#1e1e1e;
    color:#f1f1f1;
}

body.dark .poem-card{
    background:#2b2b2b;
}

body.dark .poem-title{
    color:#e0c3a3;
}

.toggle-btn{
    position:fixed;
    top:20px;
    right:20px;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#6b4c3b;
    color:white;
    cursor:pointer;
}

/* Arka plan görsel */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:1000px;
    height:1000px;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.15;
    z-index:-1;
}

h1{
    font-size:3em;
    margin-bottom:10px;
}

.quote{
    font-style:italic;
    margin-bottom:40px;
}

.poem-card{
    background:#fff8f0;
    width:600px;
    margin:20px auto;
    padding:30px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.poem-card:hover{
    transform:scale(1.03);
}

.poem-title{
    cursor:pointer;
    display:flex;
    justify-content:center;
    gap:10px;
}

.arrow{
    transition:0.3s;
}

.poem-text{
    display:none;
    margin-top:20px;
    white-space:pre-line;
    font-weight:bold;
    font-style:italic;
}

.poem-text.active{
    display:block;
}

audio{
    width:100%;
    margin-top:10px;
}

footer{
    margin-top:60px;
}

/* Yaprak animasyonu */
@keyframes sway {
  0% { transform: translateX(0) rotate(0deg);}
  50% { transform: translateX(5px) rotate(5deg);}
  100% { transform: translateX(0) rotate(0deg);}
}

.falling-leaf {
  animation: sway 8s infinite ease-in-out;
}
</style>

</head>

<body>

<button class="toggle-btn" onclick="toggleMode()">🌙 Gece Modu</button>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<!-- ŞİİRLER -->

<script>
function kart(no, baslik){
    document.write(`
    <div class="poem-card">
        <h2 class="poem-title" onclick="siirGoster(${no})">
        ${baslik} <span id="ok${no}" class="arrow">▼</span>
        </h2>
        <div id="siir${no}" class="poem-text">
            <audio controls>
            <source src="siir${no}.mp3" type="audio/mpeg">
            </audio>

            Şiir metni buraya gelecek...
        </div>
    </div>
    `);
}
</script>

<script>
kart(1,"İstiklal Marşı");
kart(2,"Şiir 2");
kart(3,"Şiir 3");
kart(4,"Şiir 4");
kart(5,"Şiir 5");
kart(6,"Şiir 6");
kart(7,"Şiir 7");
kart(8,"Şiir 8");
kart(9,"Şiir 9");
kart(10,"Şiir 10");
</script>

<footer>© 2026 Şiir Sesleri</footer>

<script>
// Aç/Kapat
function siirGoster(no){
    let siir = document.getElementById("siir"+no);
    let ok = document.getElementById("ok"+no);

    siir.classList.toggle("active");

    if(siir.classList.contains("active")){
        ok.style.transform="rotate(180deg)";
    }else{
        ok.style.transform="rotate(0deg)";
    }
}

// Gece modu
function toggleMode(){
    document.body.classList.toggle("dark");
}

// Yapraklar
const leafCount = 40;
const stripWidth = 120;
const screenHeight = window.innerHeight;
let spacing = screenHeight / leafCount;

for(let i=0;i<leafCount;i++){
    const leaf = document.createElement("img");
    leaf.src = "leafbg1.png";
    leaf.style.position="fixed";
    leaf.style.width="40px";
    leaf.style.left = Math.random()*stripWidth + "px";
    leaf.style.top = (i*spacing) + "px";
    leaf.classList.add("falling-leaf");
    document.body.appendChild(leaf);
}
</script>

</body>
</html>
