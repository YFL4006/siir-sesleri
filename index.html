<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Şiir Sesleri</title>

<style>
body{
    margin:0;
    padding:60px 20px;
    font-family:Georgia, serif;
    text-align:center;
    color:#3b2f2f;
    overflow-x:hidden;
}

/* GRADIENT GEÇİŞ (GECE-GÜNDÜZ) */
body{
    background: linear-gradient(to right, #fdf6e3 50%, #1e1e1e 50%);
    background-size:200% 100%;
    background-position:left;
    transition:1s;
}

body.dark{
    background-position:right;
    color:#f1f1f1;
}

.toggle-btn{
    position:fixed;
    top:20px;
    right:20px;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#6b4c3b;
    color:white;
    cursor:pointer;
}

/* Yunus Emre arka plan */
body::before{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:1000px;
    height:1000px;
    background-image:url("yunusemre.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.15;
    z-index:-1;
}

h1{font-size:3em;}
.quote{margin-bottom:40px;font-style:italic;}

.poem-card{
    background:#fff8f0;
    width:600px;
    margin:20px auto;
    padding:30px;
    border-radius:14px;
    transition:0.4s;
}

body.dark .poem-card{
    background:#2b2b2b;
}

.poem-card:hover{
    transform:scale(1.03);
}

.poem-title{
    cursor:pointer;
    display:flex;
    justify-content:center;
    gap:10px;
}

.arrow{transition:0.3s;}

.poem-text{
    display:none;
    margin-top:20px;
    white-space:pre-line;
    font-style:italic;
    font-weight:bold;
}

.poem-text.active{display:block;}

audio{width:100%;margin-top:10px;}

footer{margin-top:60px;}

/* YAPRAK ANİMASYONU */
@keyframes sway {
  0% { transform: translateX(0) rotate(0deg);}
  25% { transform: translateX(3px) rotate(5deg);}
  50% { transform: translateX(0) rotate(0deg);}
  75% { transform: translateX(-3px) rotate(-5deg);}
  100% { transform: translateX(0) rotate(0deg);}
}

.falling-leaf {
  animation: sway 8s infinite ease-in-out;
}
</style>

</head>

<body>

<button class="toggle-btn" onclick="toggleMode()">🌗 Geçiş</button>

<h1>Şiir Sesleri</h1>

<div class="quote">
“Sevelim sevilelim, dünya kimseye kalmaz.” <br>
— Yunus Emre
</div>

<!-- ŞİİRLER -->

<script>
function kart(no, baslik){
    document.write(`
    <div class="poem-card">
        <h2 class="poem-title" onclick="siirGoster(${no})">
        ${baslik} <span id="ok${no}" class="arrow">▼</span>
        </h2>
        <div id="siir${no}" class="poem-text">
            <audio controls>
            <source src="siir${no}.mp3" type="audio/mpeg">
            </audio>

            Şiir metni buraya gelecek...
        </div>
    </div>
    `);
}
</script>

<script>
kart(1,"İstiklal Marşı");
kart(2,"Şiir 2");
kart(3,"Şiir 3");
kart(4,"Şiir 4");
kart(5,"Şiir 5");
kart(6,"Şiir 6");
kart(7,"Şiir 7");
kart(8,"Şiir 8");
kart(9,"Şiir 9");
kart(10,"Şiir 10");
</script>

<footer>© 2026 Şiir Sesleri</footer>

<script>
// Aç/Kapat
function siirGoster(no){
    let siir = document.getElementById("siir"+no);
    let ok = document.getElementById("ok"+no);

    siir.classList.toggle("active");

    if(siir.classList.contains("active")){
        ok.style.transform="rotate(180deg)";
    }else{
        ok.style.transform="rotate(0deg)";
    }
}

// GECE-GÜNDÜZ GEÇİŞ
function toggleMode(){
    document.body.classList.toggle("dark");
}

// YAPRAKLAR
const leafCount = 60;
const stripWidth = 160;
const leafWidth = 50;
const screenHeight = window.innerHeight;
let spacing = screenHeight / leafCount;

// SOL (leafbg2.png)
for(let i=0;i<leafCount;i++){
    const leaf = document.createElement("img");
    leaf.src = "leafbg2.png";
    leaf.style.position="fixed";
    leaf.style.width=leafWidth+"px";
    leaf.style.left = Math.random()*stripWidth + "px";
    leaf.style.top = (i*spacing) + "px";
    leaf.classList.add("falling-leaf");
    leaf.style.pointerEvents="none";
    document.body.appendChild(leaf);
}

// SAĞ (leafbg1.png)
for(let i=0;i<leafCount;i++){
    const leaf = document.createElement("img");
    leaf.src = "leafbg1.png";
    leaf.style.position="fixed";
    leaf.style.width=leafWidth+"px";
    leaf.style.right = Math.random()*stripWidth + "px";
    leaf.style.top = (i*spacing) + "px";
    leaf.classList.add("falling-leaf");
    leaf.style.pointerEvents="none";
    document.body.appendChild(leaf);
}
</script>

</body>
</html>
