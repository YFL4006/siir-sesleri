<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şiir Sesleri</title>
  <style>
    body {
      background-color: #fdf6e3;
      font-family: 'Georgia', serif;
      color: #333;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Sol ve sağ dekoratif ağaç/bitki SVG'leri */
    body::before, body::after {
      content: "";
      position: fixed;
      top: 0;
      width: 100px;
      height: 100%;
      background-repeat: no-repeat;
      background-size: contain;
      opacity: 0.15;
      z-index: 0;
    }
    body::before {
      left: 0;
      background-image: url('sol-bitki.svg'); /* soldaki dekoratif bitki */
    }
    body::after {
      right: 0;
      background-image: url('sag-agac.svg'); /* sağdaki dekoratif ağaç */
    }

    h1 {
      font-size: 3em;
      margin-bottom: 30px;
      font-style: italic;
      color: #5a3e36;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }

    .poem-card {
      background-color: #fff8f0;
      border: 1px solid #e2d8c3;
      border-radius: 12px;
      width: 320px;
      margin: 0 auto;
      padding: 25px;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
      z-index: 1;
    }
    .poem-card:hover {
      transform: scale(1.03);
      box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
    }

    h2 {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #6b4c3b;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #888;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>Şiir Sesleri</h1>

  <div class="poem-card">
    <h2>İstiklal Marşı</h2>
    <audio controls>
      <source src="istiklalmarsi.mp3" type="audio/mpeg">
    </audio>
  </div>

  <footer>Yunus Emre ruhunu anan şiir sesleri</footer>
</body>
</html>
